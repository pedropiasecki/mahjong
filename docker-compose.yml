version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: mahjong_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: mahjong_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/data/postgres

volumes:
  postgres_data: