<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8" />
	<title>Mahjong — demo do motor</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<header>
		<h1>Mahjong</h1>
		<div class="hud">
			<span>Tempo: <strong id="time">00:00</strong></span>
			<span>Status: <strong id="status">parado</strong></span>
			<span id="combo" class="combo"></span>
		</div>
	</header>

	<main>
    <div class="game-area">
        <div id="board"></div>

        <div class="game-controls">
            <button id="reset-button" type="button">
                Resetar
            </button>

            <select id="difficulty">
                <option selected disabled>Selecionar dificuldade</option>
                <option value="normal">Normal</option>
                <option value="dificil">Difícil</option>
                <option value="extremo">Extremo</option>
            </select>
        </div>
    </div>
</main>

	<script type="module" src="./main.js"></script>
</body>
</html>
